<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>io.finnet Disaster Recovery</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo-mark.svg">
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/main.js" defer></script>
</head>
<body>
<div class="shell">
    <aside class="sidebar" aria-label="Navigation">
        <div class="sidebar-brand">
            <img src="/static/logo-mark.svg" alt="" width="28" height="28">
            <div>
                <div class="brand-name">io.finnet</div>
                <div class="brand-label">Disaster recovery</div>
            </div>
        </div>
        <nav aria-label="Main">
            <div class="nav-group-label">Recovery</div>
            <button type="button" class="nav-item" data-nav="home"><span class="icon" data-icon="home"></span><span class="label">Overview</span></button>
            <button type="button" class="nav-item" data-nav="verify"><span class="icon" data-icon="shieldCheck"></span><span class="label">Verify backup</span><span class="badge info">New</span></button>
            <button type="button" class="nav-item" data-nav="recover"><span class="icon" data-icon="key"></span><span class="label">Recover keys</span></button>
            <button type="button" class="nav-item" data-nav="tools" aria-disabled="true" title="Recover a vault to use chain tools"><span class="icon" data-icon="terminal"></span><span class="label">Chain tools</span></button>
            <div class="nav-group-label">Help</div>
            <a class="nav-item" href="https://docs.iofinnet.com/docs/disaster-recovery" target="_blank" rel="noopener noreferrer"><span class="icon" data-icon="book"></span><span class="label">Recovery guides</span><span class="icon icon-14" data-icon="externalLink"></span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="net-status" id="network-status" role="status" aria-live="polite"></div>
            <span class="inline"><span class="icon icon-14" data-icon="lock"></span>Runs locally · no network calls</span>
            <span>Close this tab when you finish.</span>
        </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
        <div class="page" id="page"></div>
    </main>
</div>

<dialog class="modal" id="chain-dialog" aria-labelledby="chain-dialog-title">
    <div class="modal-inner" id="chain-dialog-inner"></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
